<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'">
    <link href="./styles.css" rel="stylesheet">
    <title>Naev Map Explorer</title>
</head>

<body>
    <canvas id="map" width="1000" height="1000"></canvas>
    <canvas id="minimap" width="500" height="500"></canvas>

    <hr>

    <div id="controls" class="controls">
        <div id="loading_ui">
            <div id="input_group">
                <input type="text" size="60" id="naev_path">
                <button type="button">Load from local path</button>
            </div>
            <div id="input_group">
                <button type="button">Load data from GitHub</button>
            </div>
            <div id="input_group" class="naev_tools">
            </div>
        </div>
        <div id="search_ui">
            <div id="input_group">
                <button type="button" id="load_new_data_btn">Load new data</button>
            </div>
            <div id="input_group">
                <input type="text" size="60" id="search_box">
                <button type="button" id="search_btn">Search</button>
                <button type="button" id="clear_btn">Clear</button>
            </div>
            <div id="input_group" class="naev_tools">
            </div>
        </div>
    </div>
    <div id="status" class="status">
        <p id="statustext" class="statustext"></p>
    </div>
    <script src="js/canvas.js"></script>
    <script src="js/render.js"></script>
</body>

</html>
